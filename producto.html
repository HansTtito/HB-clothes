<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Producto | HB Clothes</title>
    <meta name="description" content="Detalle de prenda en HB Clothes. Ropa importada desde Estados Unidos con envío en Santiago de Chile." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1a1a1a" />
    <link rel="canonical" href="https://www.hbclothes.cl/producto.html" />
    <meta property="og:type" content="product" />
    <meta property="og:site_name" content="HB Clothes" />
    <meta property="og:title" content="Producto | HB Clothes" />
    <meta property="og:description" content="Ropa importada de USA. Pago seguro y envío en Santiago." />
    <meta property="og:image" content="https://www.hbclothes.cl/assets/brand/logo.png" />
    <meta property="og:locale" content="es_CL" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.hbclothes.cl/assets/brand/logo.png" />
    <link rel="icon" type="image/png" href="assets/brand/logo.png" />
    <link rel="apple-touch-icon" href="assets/brand/logo.png" />
    <link rel="stylesheet" href="styles.css" />
    <script>(function(){try{var t=localStorage.getItem('hb-theme');document.documentElement.dataset.theme=(t==='dark'||t==='light')?t:'light';}catch(e){document.documentElement.dataset.theme='light';}})();</script>
  </head>
  <body>
    <div class="notice-bar">Envíos solo Santiago | Sin cambios | Segunda mano seleccionada + prendas nuevas</div>
    <header class="navbar">
      <div class="container nav-inner">
        <a class="logo" href="index.html"><img class="logo-img" src="assets/brand/logo.png" alt="HB Clothes" /><span class="logo-text">HB Clothes</span></a>
        <nav class="nav-links">
          <a href="index.html">Inicio</a>
          <a href="tienda.html">Tienda</a>
          <a href="carrito.html">Carrito <span data-cart-count></span></a>
          <a href="checkout.html">Checkout</a>
          <button class="theme-toggle" data-theme-toggle type="button" aria-label="Cambiar tema"><span class="theme-icon-light" aria-hidden="true">🌙</span><span class="theme-icon-dark" aria-hidden="true">☀️</span></button>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="grid" style="grid-template-columns: 1.2fr 1fr; align-items: start;">
        <article class="card">
          <div class="card-media detail-media">
            <img
              id="product-main-image"
              class="detail-main-image"
              src=""
              alt="Imagen principal del producto"
              onerror="this.style.display='none';"
            />
          </div>
          <div id="thumb-grid" class="thumb-grid"></div>
        </article>
        <article class="panel">
          <p id="product-category" class="meta">Categoria</p>
          <h1 id="product-name">Nombre de producto</h1>
          <p id="product-price" class="price">$0</p>
          <p id="product-condition" class="meta"></p>
          <p id="product-description" class="lead">Descripcion del producto.</p>
          <label id="product-size-label">Talla</label>
          <select id="product-size"></select>
          <div class="actions">
            <button id="add-to-cart-btn" type="button" class="btn btn-primary">Agregar al carrito</button>
            <a class="btn btn-secondary" href="carrito.html">Ver carrito</a>
          </div>
        </article>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-main">
        <p>HB Clothes - envíos solo en Santiago, sin cambios.</p>
        <div class="socials">
          <a href="https://www.instagram.com/hb.clothes.store" target="_blank" rel="noopener noreferrer" aria-label="Instagram">Instagram</a>
          <a href="#" aria-label="TikTok">TikTok (próximamente)</a>
          <a href="https://www.facebook.com/share/1JeZUfjmzV/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">Facebook</a>
        </div>
      </div>
    </footer>
    <a class="whatsapp-float" id="whatsapp-float" href="https://wa.me/56969004163?text=Hola%20HB%20Clothes%2C%20quiero%20m%C3%A1s%20informaci%C3%B3n" target="_blank" rel="noopener noreferrer">WhatsApp</a>
    <script src="config.js?v=20260505-1"></script>
    <script src="data.js?v=20260505-1"></script>
    <script src="cart.js?v=20260505-1"></script>
    <script src="theme.js?v=20260502-1"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const productId = Number(params.get("id")) || 1;
      const product = PRODUCTS.find((item) => item.id === productId) || PRODUCTS[0];

      const category = document.getElementById("product-category");
      const name = document.getElementById("product-name");
      const price = document.getElementById("product-price");
      const condition = document.getElementById("product-condition");
      const description = document.getElementById("product-description");
      const mainImage = document.getElementById("product-main-image");
      const thumbGrid = document.getElementById("thumb-grid");

      category.textContent = product.category;
      name.textContent = product.name;
      price.textContent = formatCLP(product.price);
      condition.textContent = product.condition;
      description.textContent = product.description;

      const sizeLabel = document.getElementById("product-size-label");
      const sizeSelect = document.getElementById("product-size");
      const sizes = Array.isArray(product.sizes) ? product.sizes : [];

      if (sizes.length === 0) {
        sizeLabel.style.display = "none";
        sizeSelect.style.display = "none";
      } else {
        sizeSelect.innerHTML = sizes.map((sizeOption) => `<option value="${sizeOption}">${sizeOption}</option>`).join("");
      }

      const images = product.images && product.images.length > 0 ? product.images : [];
      const initialMainImageRaw = product.mainImage || images[0] || "";
      const galleryImagesRaw = [...new Set([initialMainImageRaw, ...images].filter((imagePath) => Boolean(imagePath)))];

      const initialMainImage = getImageUrl(initialMainImageRaw);
      const galleryImages = galleryImagesRaw.map((imagePath) => getImageUrl(imagePath));

      let currentIndex = 0;

      function setActiveImage(index) {
        currentIndex = (index + galleryImages.length) % galleryImages.length;
        mainImage.src = galleryImages[currentIndex];
        document.querySelectorAll(".thumb-grid button").forEach((btn, i) => {
          btn.classList.toggle("active", i === currentIndex);
        });
      }

      if (initialMainImage) {
        mainImage.style.display = "block";
        mainImage.src = initialMainImage;
        mainImage.alt = product.name;
      } else {
        mainImage.style.display = "none";
        mainImage.parentElement.append("Imagen principal pendiente");
      }

      if (galleryImages.length <= 1) {
        thumbGrid.style.display = "none";
      } else {
        // Flechas prev / next
        const mediaBox = mainImage.closest(".detail-media");
        const prevBtn = document.createElement("button");
        prevBtn.className = "gallery-arrow prev";
        prevBtn.type = "button";
        prevBtn.setAttribute("aria-label", "Imagen anterior");
        prevBtn.innerHTML = "&#8249;";
        prevBtn.addEventListener("click", () => setActiveImage(currentIndex - 1));

        const nextBtn = document.createElement("button");
        nextBtn.className = "gallery-arrow next";
        nextBtn.type = "button";
        nextBtn.setAttribute("aria-label", "Imagen siguiente");
        nextBtn.innerHTML = "&#8250;";
        nextBtn.addEventListener("click", () => setActiveImage(currentIndex + 1));

        mediaBox.appendChild(prevBtn);
        mediaBox.appendChild(nextBtn);

        // Teclado ← →
        document.addEventListener("keydown", (e) => {
          if (e.key === "ArrowLeft") setActiveImage(currentIndex - 1);
          if (e.key === "ArrowRight") setActiveImage(currentIndex + 1);
        });

        thumbGrid.style.display = "grid";
        thumbGrid.innerHTML = galleryImages
          .map(
            (imagePath, index) => `
              <button type="button" aria-label="Ver imagen ${index + 1}" class="${index === 0 ? "active" : ""}">
                <img src="${imagePath}" alt="${product.name} vista ${index + 1}" loading="lazy" onerror="this.style.opacity='0.35';" />
              </button>
            `
          )
          .join("");

        thumbGrid.querySelectorAll("button").forEach((btn, i) => {
          btn.addEventListener("click", () => setActiveImage(i));
        });
      }

      const addToCartBtn = document.getElementById("add-to-cart-btn");
      addToCartBtn.addEventListener("click", function () {
        const selectedSize = sizes.length === 0 ? null : sizeSelect.value;
        addToCart(product.id, selectedSize, 1);
      });

      const whatsappFloat = document.getElementById("whatsapp-float");
      if (whatsappFloat && product && product.name) {
        const wspMsg = "Hola HB Clothes, quiero más información sobre el producto: " + product.name;
        whatsappFloat.href = "https://wa.me/56969004163?text=" + encodeURIComponent(wspMsg);
      }
    </script>
  </body>
</html>
